<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSLA Day Trading 學院</title>
<meta name="description" content="由 Level 1 到 Level 8 嘅美股 Day Trading 互動學習平台：章節目錄、書籤、筆記、影片、留言、進度追蹤同互動計算器。">
<meta name="theme-color" content="#0c1030">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script>
  // 盡早套用主題同字體大小，避免閃爍
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('ta:ui') || '{}');
      if (s.theme) document.documentElement.setAttribute('data-theme', s.theme);
      if (s.font) document.documentElement.style.setProperty('--font-scale', s.font);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="readbar" aria-hidden="true"><div id="readbar-fill"></div></div>

<header class="topbar">
  <button class="icon-btn only-mobile" id="btn-menu" aria-label="打開目錄">☰</button>
  <a class="brand" href="#/">
    <span class="brand-logo"><img src="assets/icon.svg" alt="" width="34" height="34"></span>
    <span class="brand-text">TSLA <em>Day Trading</em> 學院</span>
  </a>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜尋內容、詞彙…（按 / 快速搜尋）" autocomplete="off">
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btn-font" title="字體大小" aria-label="字體大小">Aa</button>
    <button class="icon-btn" id="btn-theme" title="深色／淺色" aria-label="切換主題">🌓</button>
    <button class="profile-chip" id="btn-profile" title="切換使用者"></button>
  </div>
</header>

<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="課程目錄">
    <div class="sidebar-inner" id="toc"></div>
  </nav>
  <div id="scrim" class="scrim" hidden></div>

  <main id="main" class="main" tabindex="-1">
    <div id="view"></div>
  </main>

  <aside id="rightrail" class="rightrail" aria-label="本頁目錄"></aside>
</div>

<div id="selection-pop" class="selection-pop" hidden>
  <button data-act="hl-yellow" title="螢光筆（黃）"><span class="dot y"></span></button>
  <button data-act="hl-green" title="螢光筆（綠）"><span class="dot g"></span></button>
  <button data-act="hl-pink" title="螢光筆（粉紅）"><span class="dot p"></span></button>
  <button data-act="hl-note">📝 加備註</button>
  <button data-act="hl-comment">💬 留言</button>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="js/vendor/marked.min.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/data-glossary.js"></script>
<script src="js/data-quizzes.js"></script>
<script src="content/level1.js"></script>
<script src="content/level2.js"></script>
<script src="content/level3.js"></script>
<script src="content/level4.js"></script>
<script src="content/level5.js"></script>
<script src="content/level6.js"></script>
<script src="content/level7.js"></script>
<script src="content/level8.js"></script>
<script src="content/level9.js"></script>
<script src="content/qa.js"></script>
<script src="js/tools.js"></script>
<script src="js/tools2.js"></script>
<script src="js/vcp.js"></script>
<script src="js/sim.js"></script>
<script src="js/replay.js"></script>
<script src="js/journal.js"></script>
<script src="js/learn.js"></script>
<script src="js/data.js"></script>
<script src="js/lab.js"></script>
<script src="js/edge.js"></script>
<script src="js/picks.js"></script>
<script src="js/vendor/firebase-app-compat.js"></script>
<script src="js/vendor/firebase-auth-compat.js"></script>
<script src="js/vendor/firebase-firestore-compat.js"></script>
<script src="js/cloud-config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
